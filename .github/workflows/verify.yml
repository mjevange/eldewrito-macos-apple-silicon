# Verifies that the documented install still works.
#
# Runs the same steps install.sh runs, on a GitHub-hosted Apple Silicon macOS
# runner, and fails loudly if any of them break. Its job is catching upstream
# drift - a moved release asset, a renamed Homebrew flag, a new macOS image -
# before someone hits it on their own Mac.
#
# LIMITATION: GitHub's arm64 runners report "Apple M1 (Virtual)" and have a
# paravirtualised GPU. This proves installation and launcher startup. It cannot
# prove the game renders; that needs real hardware. See docs/FINDINGS.md.

name: verify

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, to catch upstream drift
  push:
    paths:
      - "install.sh"
      - ".github/workflows/verify.yml"

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      WINEPREFIX: /Users/runner/my-game-prefix
      ELDEW_RUNTIME: /Users/runner/.eldewrito/runtime
      WINEDEBUG: "-all"

    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: bash install.sh --check

      - name: Runtime, prefix and .NET
        timeout-minutes: 30
        run: |
          # install.sh's launcher step is interactive, so drive the
          # non-interactive parts directly and assert on each.
          source /dev/stdin <<'SH'
          set -euo pipefail
          RT="$ELDEW_RUNTIME"
          mkdir -p "$RT"
          curl -fL --retry 3 -sS -o "$RT/rt.tar.gz" \
            "https://github.com/frankea/winecx-gptk/releases/download/runtime-v4.6.4/Libraries.tar.gz"
          tar -xzf "$RT/rt.tar.gz" -C "$RT"
          xattr -dr com.apple.quarantine "$RT" 2>/dev/null || true
          W="$RT/Libraries/Wine/lib/wine/x86_64-unix/wine"
          test -x "$W" || { echo "FAIL: wine binary missing"; exit 1; }
          echo "WINE=$W" >> "$GITHUB_ENV"
          "$W" --version
          SH

      - name: Assert Wine version
        run: |
          V="$("$WINE" --version)"
          echo "wine: $V"
          # Wine 7.x cannot run the launcher - see docs/FINDINGS.md.
          case "$V" in
            wine-7.*) echo "FAIL: Wine 7.x will not run the launcher"; exit 1 ;;
          esac

      - name: Prefix
        timeout-minutes: 15
        run: |
          "$WINE" wineboot --init >/dev/null 2>&1 || true
          sleep 40
          test -d "$WINEPREFIX/drive_c/windows" || { echo "FAIL: prefix not initialised"; exit 1; }
          mkdir -p "$WINEPREFIX/drive_c/stage"
          "$WINE" cmd /c ver || true

      - name: .NET 6 Desktop Runtime
        timeout-minutes: 15
        run: |
          cd "$WINEPREFIX/drive_c/stage"
          curl -fL -sS -o dotnet.exe "https://aka.ms/dotnet/6.0/windowsdesktop-runtime-win-x64.exe" \
            || curl -fL -sS -o dotnet.exe "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/6.0.36/windowsdesktop-runtime-6.0.36-win-x64.exe"
          "$WINE" 'C:\stage\dotnet.exe' /quiet /norestart >/dev/null 2>&1 || true
          sleep 10
          D="$WINEPREFIX/drive_c/Program Files/dotnet/shared/Microsoft.WindowsDesktop.App"
          test -d "$D" || { echo "FAIL: .NET did not install"; exit 1; }
          echo "installed: $(ls "$D" | tr '\n' ' ')"

      - name: Launcher binary
        run: |
          cd "$WINEPREFIX/drive_c/stage"
          curl -fL -sS -o launcher.exe \
            "https://github.com/eldewrito2/ElDewritoLauncher/releases/download/0.1.1/launcher.exe"
          file launcher.exe
          test -s launcher.exe || { echo "FAIL: launcher.exe empty"; exit 1; }

      - name: Launcher starts and renders a window
        timeout-minutes: 10
        run: |
          WINEDEBUG=+err,+warn "$WINE" 'C:\stage\launcher.exe' > "$HOME/l.log" 2>&1 &
          sleep 90
          /usr/sbin/screencapture -x "$HOME/launcher.png" 2>/dev/null || true

          OVERFLOWS=$(grep -c 'stack overflow' "$HOME/l.log" || true)
          APPS=$(osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>/dev/null || echo "")
          echo "foreground apps: $APPS"
          echo "stack overflows: $OVERFLOWS"

          test "$OVERFLOWS" -eq 0 || { echo "FAIL: launcher crashed"; tail -20 "$HOME/l.log"; exit 1; }
          echo "$APPS" | grep -qi wine || { echo "FAIL: no launcher window"; tail -20 "$HOME/l.log"; exit 1; }
          echo "PASS: launcher running with a window"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-evidence
          path: |
            /Users/runner/launcher.png
            /Users/runner/l.log
          if-no-files-found: warn
