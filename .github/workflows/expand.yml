# Two follow-ups to the Wine 11.16 result.
#
#  console   - same working runtime, but with a visible Terminal tailing the
#              Wine log beside the launcher, so the video shows live console
#              output rather than a silent desktop. Also attempts to click
#              through the wizard to reach the download stage.
#  plainwine - is the GPTK runtime actually REQUIRED for the launcher, or does
#              any modern Wine work? If plain wine-devel 11.18 also boots it,
#              GPTK only matters for rendering and users get more options.
#              Earlier attempts at this build timed out at 3/8 minutes; it is
#              slow under Rosetta rather than hung, so limits are generous.

name: expand
on: workflow_dispatch

jobs:
  console:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      WINEPREFIX: /Users/runner/cfx
      WINEDEBUG: "-all"

    steps:
      - name: Prebuilt winecx-gptk 4.6.4
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          mkdir -p "$HOME/ww"
          curl -fL --retry 3 -o "$HOME/ww.tar.gz" \
            "https://github.com/frankea/winecx-gptk/releases/download/runtime-v4.6.4/Libraries.tar.gz"
          tar -xzf "$HOME/ww.tar.gz" -C "$HOME/ww"
          xattr -dr com.apple.quarantine "$HOME/ww" 2>/dev/null || true
          echo "WINE=$HOME/ww/Libraries/Wine/lib/wine/x86_64-unix/wine" >> "$GITHUB_ENV"

      - name: Prefix and .NET
        timeout-minutes: 25
        run: |
          "$WINE" --version
          "$WINE" wineboot --init || echo "WARN: wineboot"
          sleep 40
          mkdir -p "$WINEPREFIX/drive_c/stage"; cd "$WINEPREFIX/drive_c/stage"
          curl -fL -o dotnet.exe "https://aka.ms/dotnet/6.0/windowsdesktop-runtime-win-x64.exe" \
            || curl -fL -o dotnet.exe "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/6.0.36/windowsdesktop-runtime-6.0.36-win-x64.exe"
          "$WINE" 'C:\stage\dotnet.exe' /quiet /norestart || echo "WARN: dotnet"
          sleep 15
          ls "$WINEPREFIX/drive_c/Program Files/dotnet/shared/Microsoft.WindowsDesktop.App" >/dev/null 2>&1 \
            && echo "RESULT: .NET OK" || echo "RESULT: .NET MISSING"
          curl -fL -o launcher.exe \
            "https://github.com/eldewrito2/ElDewritoLauncher/releases/download/0.1.1/launcher.exe"

      - name: Launch with a VISIBLE console
        timeout-minutes: 20
        run: |
          : > "$HOME/c.log"
          # A Terminal window tailing the log, so the capture shows the console.
          osascript \
            -e 'tell application "Terminal"' \
            -e 'activate' \
            -e "do script \"tail -f $HOME/c.log\"" \
            -e 'set bounds of front window to {10, 480, 1014, 762}' \
            -e 'end tell' || echo "WARN: could not open Terminal"
          sleep 3
          WINEDEBUG=+err,+warn "$WINE" 'C:\stage\launcher.exe' >> "$HOME/c.log" 2>&1 &
          ( /usr/sbin/screencapture -v -V 150 "$HOME/console-boot.mp4" >/dev/null 2>&1 \
            || echo "video unavailable" ) &

          # Try to advance the wizard: accessibility first, then a coordinate click.
          brew install cliclick >/dev/null 2>&1 || true
          for m in 1 2 3 4; do
            sleep 45
            /usr/sbin/screencapture -x "$HOME/console-m$m.png" 2>/dev/null || true
            echo "--- minute $m ---"
            osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>/dev/null || true
            if [ "$m" -le 2 ]; then
              osascript -e 'tell application "System Events" to tell process "launcher" to click button "Next" of window 1' 2>/dev/null \
                && echo "clicked Next via accessibility" \
                || { command -v cliclick >/dev/null && cliclick c:713,527 && echo "clicked Next by coordinate" || echo "no click method"; }
            fi
          done
          echo "RESULT: overflows=$(grep -c 'stack overflow' "$HOME/c.log" || echo 0)"
          echo "RESULT: bytes=$(wc -c < "$HOME/c.log")"
          echo "--- prefix tree ---"
          find "$WINEPREFIX/drive_c/Program Files" -maxdepth 2 -type d 2>/dev/null | head -12
          du -sh "$WINEPREFIX" 2>/dev/null || true
          tail -30 "$HOME/c.log"

      - name: Evidence
        if: always()
        run: |
          mkdir -p /tmp/ev
          cp "$HOME"/console-*.png /tmp/ev/ 2>/dev/null || true
          cp "$HOME"/console-boot.mp4 /tmp/ev/ 2>/dev/null || true
          cp "$HOME/c.log" /tmp/ev/ 2>/dev/null || true
          ls -la /tmp/ev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console
          path: /tmp/ev
          if-no-files-found: warn

  # Does the launcher need GPTK at all, or just a modern Wine?
  plainwine:
    runs-on: macos-15
    timeout-minutes: 70
    env:
      WINEPREFIX: /Users/runner/pwfx
      WINEDEBUG: "-all"

    steps:
      - name: Plain wine-devel 11.18 (no GPTK)
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          mkdir -p "$HOME/pw"
          curl -fL --retry 3 -o "$HOME/pw.tar.xz" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.18/wine-devel-11.18-osx64.tar.xz"
          tar -xJf "$HOME/pw.tar.xz" -C "$HOME/pw" --strip-components=1
          xattr -dr com.apple.quarantine "$HOME/pw" 2>/dev/null || true
          find "$HOME/pw" -maxdepth 4 -name 'wine*' -type f -perm -u+x | head -8
          W=$(find "$HOME/pw" -maxdepth 4 -name 'wine' -type f -perm -u+x | head -1)
          echo "WINE=$W" >> "$GITHUB_ENV"
          echo "selected: ${W:-NONE}"

      # Previously timed out at 3 and 8 minutes. Slow under Rosetta, not hung.
      - name: Version and prefix (generous)
        timeout-minutes: 35
        continue-on-error: true
        run: |
          "$WINE" --version 2>&1 | tee /tmp/pw.txt || echo "WARN: version"
          "$WINE" wineboot --init || echo "WARN: wineboot"
          sleep 60
          "$WINE" cmd /c ver || echo "WARN: ver"

      - name: .NET and launcher
        timeout-minutes: 25
        continue-on-error: true
        run: |
          mkdir -p "$WINEPREFIX/drive_c/stage"; cd "$WINEPREFIX/drive_c/stage"
          curl -fL -o dotnet.exe "https://aka.ms/dotnet/6.0/windowsdesktop-runtime-win-x64.exe" \
            || curl -fL -o dotnet.exe "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/6.0.36/windowsdesktop-runtime-6.0.36-win-x64.exe"
          "$WINE" 'C:\stage\dotnet.exe' /quiet /norestart || echo "WARN: dotnet"
          sleep 15
          ls "$WINEPREFIX/drive_c/Program Files/dotnet/shared/Microsoft.WindowsDesktop.App" >/dev/null 2>&1 \
            && echo "RESULT: .NET OK" || echo "RESULT: .NET MISSING"
          curl -fL -o launcher.exe \
            "https://github.com/eldewrito2/ElDewritoLauncher/releases/download/0.1.1/launcher.exe"
          WINEDEBUG=+err,+warn "$WINE" 'C:\stage\launcher.exe' > "$HOME/p.log" 2>&1 &
          for m in 1 2 3; do
            sleep 60
            osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>/dev/null || true
            /usr/sbin/screencapture -x "$HOME/plain-m$m.png" 2>/dev/null || true
          done
          echo "RESULT: overflows=$(grep -c 'stack overflow' "$HOME/p.log" || echo 0)"
          echo "RESULT: bytes=$(wc -c < "$HOME/p.log")"
          tail -25 "$HOME/p.log"

      - name: Evidence
        if: always()
        run: |
          mkdir -p /tmp/ev
          cp "$HOME"/plain-*.png /tmp/ev/ 2>/dev/null || true
          cp "$HOME/p.log" /tmp/ev/ 2>/dev/null || true
          cp /tmp/pw.txt /tmp/ev/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plainwine
          path: /tmp/ev
          if-no-files-found: warn
