# The two install routes still marked untested.
#
#   whisky     - the maintained Whisky fork is a GUI app, which would suit a
#                non-technical user far better than a shell script. Does it
#                install, and does it use the same runtime we verified?
#   apple-gptk - Apple's own GPTK. It failed once and the reason was never
#                diagnosed, because continue-on-error swallowed it. This run
#                captures the actual error.

name: paths
on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- whisky
  whisky:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Install the Whisky fork
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          URL=$(curl -fsSL https://api.github.com/repos/frankea/Whisky/releases/latest \
                | grep -o 'https://[^"]*\.dmg' | head -1)
          echo "release asset: ${URL:-NONE}"
          test -n "$URL" || { echo "FAIL: no dmg in latest release"; exit 1; }
          curl -fL --retry 3 -sS -o "$HOME/whisky.dmg" "$URL"
          ls -la "$HOME/whisky.dmg"
          hdiutil attach "$HOME/whisky.dmg" -nobrowse -quiet -mountpoint /Volumes/Whisky
          ls -la /Volumes/Whisky
          cp -R "/Volumes/Whisky/Whisky.app" /Applications/ 2>/dev/null \
            || cp -R /Volumes/Whisky/*.app /Applications/
          hdiutil detach /Volumes/Whisky -quiet || true
          xattr -dr com.apple.quarantine /Applications/Whisky.app 2>/dev/null || true
          echo "RESULT: whisky installed"
          defaults read /Applications/Whisky.app/Contents/Info.plist CFBundleShortVersionString \
            | sed 's/^/RESULT: whisky_version=/'

      - name: What Wine does it ship or fetch?
        timeout-minutes: 25
        run: |
          echo "--- bundled inside the app? ---"
          find /Applications/Whisky.app -iname 'wine*' -maxdepth 6 2>/dev/null | head -10 || echo "(none bundled)"

          # Whisky downloads its runtime on first run; launch it headless-ish
          # and watch the support directory appear.
          open -a Whisky --args --headless 2>/dev/null || open -a Whisky 2>/dev/null || true
          for i in $(seq 1 20); do
            sleep 15
            D=$(find "$HOME/Library/Application Support" -maxdepth 2 -iname '*hisky*' 2>/dev/null | head -1)
            [ -n "$D" ] && { echo "support dir: $D"; du -sh "$D" 2>/dev/null; }
            W=$(find "$HOME/Library" -maxdepth 8 -name 'wine' -type f -perm -u+x 2>/dev/null | head -1)
            [ -n "$W" ] && { echo "RESULT: whisky_wine=$W"; "$W" --version 2>&1 | head -1 | sed 's/^/RESULT: whisky_wine_version=/'; break; }
          done
          [ -n "${W:-}" ] || echo "RESULT: whisky_wine=not-found (may need GUI interaction)"

          echo "--- does it use the same runtime we verified? ---"
          find "$HOME/Library" -iname 'WhiskyWineVersion.plist' 2>/dev/null | head -2 | while read -r p; do
            echo "  $p"; cat "$p" | tr -d '\n' | sed 's/  */ /g' | head -c 500; echo
          done
          /usr/sbin/screencapture -x "$HOME/whisky.png" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whisky
          path: /Users/runner/whisky.png
          if-no-files-found: warn

  # ------------------------------------------------------------ apple-gptk
  apple-gptk:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: x86_64 Homebrew via tarball
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          sudo mkdir -p /usr/local/homebrew
          sudo chown -R "$(whoami)" /usr/local/homebrew
          curl -fsSL https://github.com/Homebrew/brew/tarball/master \
            | tar xz --strip 1 -C /usr/local/homebrew
          arch -x86_64 /usr/local/homebrew/bin/brew --version | head -2
          echo "RESULT: x86_64 brew OK"

      # Previously this was continue-on-error, which hid the reason. Capture it.
      - name: Apple's tap - full error output
        id: apple
        continue-on-error: true
        run: |
          B=/usr/local/homebrew/bin/brew
          export HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ENV_HINTS=1
          echo "::group::tap"
          arch -x86_64 $B tap apple/apple 2>&1 | tail -20 || echo "TAP FAILED"
          echo "::endgroup::"
          echo "--- does the formula resolve? ---"
          arch -x86_64 $B info apple/apple/game-porting-toolkit 2>&1 | head -25 || echo "INFO FAILED"
          echo "--- attempt install, last 60 lines of output ---"
          set -o pipefail
          arch -x86_64 $B install apple/apple/game-porting-toolkit 2>&1 | tail -60

      - name: Gcenx's apple tap - full error output
        id: gcenx
        continue-on-error: true
        run: |
          B=/usr/local/homebrew/bin/brew
          export HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ENV_HINTS=1
          arch -x86_64 $B tap gcenx/apple 2>&1 | tail -10 || echo "TAP FAILED"
          arch -x86_64 $B info gcenx/apple/game-porting-toolkit 2>&1 | head -20 || true
          set -o pipefail
          arch -x86_64 $B install gcenx/apple/game-porting-toolkit 2>&1 | tail -60

      - name: Verdict
        run: |
          echo "RESULT: apple_tap=${{ steps.apple.outcome }}"
          echo "RESULT: gcenx_tap=${{ steps.gcenx.outcome }}"
          W=$(find /usr/local/homebrew -name 'wine64' -type f -perm -u+x 2>/dev/null | head -1)
          [ -n "$W" ] || W=$(find /usr/local/homebrew -name 'wine' -type f -perm -u+x 2>/dev/null | head -1)
          if [ -n "$W" ]; then
            echo "RESULT: apple_gptk_wine=$W"
            "$W" --version 2>&1 | head -1 | sed 's/^/RESULT: apple_gptk_version=/'
          else
            echo "RESULT: apple_gptk_wine=NONE - neither tap produced a wine binary"
          fi
