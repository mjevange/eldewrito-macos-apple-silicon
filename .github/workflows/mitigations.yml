# Push toward a launcher that actually boots.
#
# Established: under the GPTK cask (wine-7.7 / GPTK 1.1) the launcher loads
# .NET, fails to get WinRT toast notifications, then stack-overflows. .NET
# version is irrelevant (6.0.29 and 6.0.36 give byte-identical logs).
#
# Two lines of attack:
#   A) winver  - the crash follows RoGetActivationFactory for
#      Windows.UI.Notifications.ToastNotificationManager. If the launcher only
#      tries WinRT because we claim Windows 10, an older reported version may
#      skip that path. Cheap to test.
#   B) apple   - build Apple's own GPTK (newer Wine) via the tarball x86_64
#      Homebrew, which we confirmed still works. Apple's DMG is NOT needed:
#      it only supplies D3DMetal for rendering, and we only need the launcher
#      to start.

name: mitigations
on: workflow_dispatch

jobs:
  # ---------------------------------------------------------------- A
  winver:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      WINEPREFIX: /Users/runner/pfx
      WINEDEBUG: "-all"
    strategy:
      fail-fast: false
      matrix:
        win: [win10, win81, win7, winxp]

    steps:
      - name: Install GPTK
        run: |
          brew install --cask gcenx/wine/game-porting-toolkit
          xattr -dr com.apple.quarantine "/Applications/Game Porting Toolkit.app" 2>/dev/null || true
          wine64 --version

      - name: Prefix as ${{ matrix.win }}
        run: |
          wine64 wineboot --init || echo "WARN: wineboot nonzero"
          sleep 30
          wine64 reg add 'HKCU\Software\Wine' /v Version /d ${{ matrix.win }} /f
          wine64 cmd /c ver || echo "WARN: ver failed"
          mkdir -p "$WINEPREFIX/drive_c/stage"

      - name: .NET 6
        run: |
          cd "$WINEPREFIX/drive_c/stage"
          curl -fL -o dotnet.exe "https://aka.ms/dotnet/6.0/windowsdesktop-runtime-win-x64.exe" \
            || curl -fL -o dotnet.exe "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/6.0.36/windowsdesktop-runtime-6.0.36-win-x64.exe"
          wine64 'C:\stage\dotnet.exe' /quiet /norestart || echo "WARN: installer nonzero"
          sleep 10
          ls "$WINEPREFIX/drive_c/Program Files/dotnet/shared/Microsoft.WindowsDesktop.App" 2>/dev/null \
            && echo "RESULT: .NET OK" || echo "RESULT: .NET MISSING"

      - name: Launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/eldewrito2/ElDewritoLauncher/releases/latest \
            | grep -o 'https://[^"]*launcher\.exe' | head -1)
          [ -n "$URL" ] || URL="https://github.com/eldewrito2/ElDewritoLauncher/releases/download/0.1.1/launcher.exe"
          curl -fL -o "$WINEPREFIX/drive_c/stage/launcher.exe" "$URL"
          WINEDEBUG=+err,+warn wine64 'C:\stage\launcher.exe' > "$HOME/l.log" 2>&1 &
          # 90s of actual video from launch, alongside the stills.
          ( /usr/sbin/screencapture -v -V 90 "$HOME/${{ matrix.win }}-boot.mp4" >/dev/null 2>&1 || \
            echo "video capture unavailable" ) &
          for m in 1 2 3; do
            sleep 60
            APPS=$(osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>/dev/null || echo "?")
            echo "min $m apps: $APPS"
            /usr/sbin/screencapture -x "$HOME/${{ matrix.win }}-m$m.png" 2>/dev/null || true
          done
          echo "RESULT: winver=${{ matrix.win }}"
          echo "RESULT: overflows=$(grep -c 'stack overflow' "$HOME/l.log" || echo 0)"
          echo "RESULT: toast_fail=$(grep -c 'ToastNotificationManager' "$HOME/l.log" || echo 0)"
          echo "RESULT: bytes=$(wc -c < "$HOME/l.log")"
          tail -20 "$HOME/l.log"

      - name: Evidence
        if: always()
        run: |
          mkdir -p /tmp/ev
          cp "$HOME"/*.png /tmp/ev/ 2>/dev/null || true
          cp "$HOME"/*.mp4 /tmp/ev/ 2>/dev/null || true
          cp "$HOME/l.log" /tmp/ev/ 2>/dev/null || true
          ls -la /tmp/ev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-${{ matrix.win }}
          path: /tmp/ev
          if-no-files-found: warn

  # ---------------------------------------------------------------- B
  apple-gptk:
    runs-on: macos-15
    timeout-minutes: 330
    env:
      WINEPREFIX: /Users/runner/apfx
      WINEDEBUG: "-all"

    steps:
      - name: Rosetta and x86_64 Homebrew via tarball
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          sudo mkdir -p /usr/local/homebrew
          sudo chown -R "$(whoami)" /usr/local/homebrew
          curl -fsSL https://github.com/Homebrew/brew/tarball/master \
            | tar xz --strip 1 -C /usr/local/homebrew
          arch -x86_64 /usr/local/homebrew/bin/brew --version | head -2
          echo "RESULT: x86_64 brew OK"

      # Apple's tap compiles Wine from source. gcenx's apple tap is a patched
      # equivalent; try Apple's first, fall back.
      - name: Build Apple GPTK (slow)
        id: build
        continue-on-error: true
        run: |
          B=/usr/local/homebrew/bin/brew
          export HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_AUTO_UPDATE=1
          arch -x86_64 $B tap apple/apple 2>&1 | tail -3 || true
          if arch -x86_64 $B install apple/apple/game-porting-toolkit 2>&1 | tail -25; then
            echo "RESULT: apple formula built"
          else
            echo "RESULT: apple formula FAILED, trying gcenx"
            arch -x86_64 $B tap gcenx/apple 2>&1 | tail -3 || true
            arch -x86_64 $B install gcenx/apple/game-porting-toolkit 2>&1 | tail -25 \
              && echo "RESULT: gcenx formula built" || echo "RESULT: both formulas FAILED"
          fi

      - name: Locate and version
        continue-on-error: true
        timeout-minutes: 10
        run: |
          W=$(find /usr/local/homebrew -name 'wine64' -type f -perm -u+x 2>/dev/null | head -1)
          [ -n "$W" ] || W=$(find /usr/local/homebrew -name 'wine' -type f -perm -u+x 2>/dev/null | head -1)
          echo "WINE=$W" >> "$GITHUB_ENV"
          echo "selected: ${W:-NONE}"
          [ -n "$W" ] && "$W" --version 2>&1 | tee /tmp/wine.txt || echo "no wine"

      - name: Prefix, .NET, launcher
        if: env.WINE != ''
        continue-on-error: true
        timeout-minutes: 40
        run: |
          "$WINE" wineboot --init || echo "WARN: wineboot"
          sleep 30
          "$WINE" cmd /c ver || echo "WARN: ver"
          mkdir -p "$WINEPREFIX/drive_c/stage"; cd "$WINEPREFIX/drive_c/stage"
          curl -fL -o dotnet.exe "https://aka.ms/dotnet/6.0/windowsdesktop-runtime-win-x64.exe"
          "$WINE" 'C:\stage\dotnet.exe' /quiet /norestart || echo "WARN: dotnet"
          sleep 10
          ls "$WINEPREFIX/drive_c/Program Files/dotnet/shared/Microsoft.WindowsDesktop.App" 2>/dev/null \
            && echo "RESULT: .NET OK" || echo "RESULT: .NET MISSING"
          curl -fL -o launcher.exe \
            "https://github.com/eldewrito2/ElDewritoLauncher/releases/download/0.1.1/launcher.exe"
          WINEDEBUG=+err,+warn "$WINE" 'C:\stage\launcher.exe' > "$HOME/a.log" 2>&1 &
          for m in 1 2 3; do
            sleep 60
            osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>/dev/null || true
            /usr/sbin/screencapture -x "$HOME/apple-m$m.png" 2>/dev/null || true
          done
          echo "RESULT: overflows=$(grep -c 'stack overflow' "$HOME/a.log" || echo 0)"
          echo "RESULT: bytes=$(wc -c < "$HOME/a.log")"
          tail -25 "$HOME/a.log"

      - name: Evidence
        if: always()
        run: |
          mkdir -p /tmp/ev
          cp "$HOME"/apple-m*.png /tmp/ev/ 2>/dev/null || true
          cp "$HOME/a.log" /tmp/ev/ 2>/dev/null || true
          cp /tmp/wine.txt /tmp/ev/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-gptk
          path: /tmp/ev
          if-no-files-found: warn

  # ---------------------------------------------------------------- C
  # Prebuilt CrossOver+GPTK runtime shipped by the maintained Whisky fork.
  # gptkCapable=true, DXVK 1.10.3, DXMT 0.80, built Aug 2026 - far newer than
  # the Homebrew cask's wine-7.7, and no 75-minute compile.
  whiskywine:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      WINEPREFIX: /Users/runner/wfx
      WINEDEBUG: "-all"

    steps:
      - name: Fetch prebuilt runtime
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          mkdir -p "$HOME/ww"
          curl -fL --retry 3 -o "$HOME/ww.tar.gz" \
            "https://github.com/frankea/winecx-gptk/releases/download/runtime-v4.6.4/Libraries.tar.gz"
          ls -la "$HOME/ww.tar.gz"
          tar -xzf "$HOME/ww.tar.gz" -C "$HOME/ww"
          xattr -dr com.apple.quarantine "$HOME/ww" 2>/dev/null || true
          echo "--- tree ---"
          find "$HOME/ww" -maxdepth 3 -type d | head -20
          echo "--- wine binaries ---"
          find "$HOME/ww" -name 'wine*' -type f -perm -u+x | head -10

      - name: Select wine
        timeout-minutes: 10
        continue-on-error: true
        run: |
          W=$(find "$HOME/ww" -name 'wine64' -type f -perm -u+x | head -1)
          [ -n "$W" ] || W=$(find "$HOME/ww" -name 'wine' -type f -perm -u+x | head -1)
          echo "selected: ${W:-NONE}"
          echo "WINE=$W" >> "$GITHUB_ENV"
          [ -n "$W" ] && "$W" --version 2>&1 | tee /tmp/wine.txt || echo "no wine binary"

      - name: Prefix, .NET, launcher
        if: env.WINE != ''
        continue-on-error: true
        timeout-minutes: 35
        run: |
          "$WINE" wineboot --init || echo "WARN: wineboot"
          sleep 40
          "$WINE" cmd /c ver || echo "WARN: ver"
          mkdir -p "$WINEPREFIX/drive_c/stage"; cd "$WINEPREFIX/drive_c/stage"
          curl -fL -o dotnet.exe "https://aka.ms/dotnet/6.0/windowsdesktop-runtime-win-x64.exe" \
            || curl -fL -o dotnet.exe "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/6.0.36/windowsdesktop-runtime-6.0.36-win-x64.exe"
          "$WINE" 'C:\stage\dotnet.exe' /quiet /norestart || echo "WARN: dotnet installer"
          sleep 15
          ls "$WINEPREFIX/drive_c/Program Files/dotnet/shared/Microsoft.WindowsDesktop.App" 2>/dev/null \
            && echo "RESULT: .NET OK" || echo "RESULT: .NET MISSING"
          curl -fL -o launcher.exe \
            "https://github.com/eldewrito2/ElDewritoLauncher/releases/download/0.1.1/launcher.exe"
          WINEDEBUG=+err,+warn "$WINE" 'C:\stage\launcher.exe' > "$HOME/w.log" 2>&1 &
          ( /usr/sbin/screencapture -v -V 90 "$HOME/whisky-boot.mp4" >/dev/null 2>&1 || \
            echo "video unavailable" ) &
          for m in 1 2 3; do
            sleep 60
            osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>/dev/null || true
            /usr/sbin/screencapture -x "$HOME/whisky-m$m.png" 2>/dev/null || true
          done
          echo "RESULT: overflows=$(grep -c 'stack overflow' "$HOME/w.log" || echo 0)"
          echo "RESULT: toast_fail=$(grep -c 'ToastNotificationManager' "$HOME/w.log" || echo 0)"
          echo "RESULT: bytes=$(wc -c < "$HOME/w.log")"
          tail -25 "$HOME/w.log"

      - name: Evidence
        if: always()
        run: |
          mkdir -p /tmp/ev
          cp "$HOME"/whisky-*.png /tmp/ev/ 2>/dev/null || true
          cp "$HOME"/whisky-boot.mp4 /tmp/ev/ 2>/dev/null || true
          cp "$HOME/w.log" /tmp/ev/ 2>/dev/null || true
          cp /tmp/wine.txt /tmp/ev/ 2>/dev/null || true
          ls -la /tmp/ev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whiskywine
          path: /tmp/ev
          if-no-files-found: warn
