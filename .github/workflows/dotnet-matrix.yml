# 2x2: does the launcher start, as a function of Wine version AND .NET version?
#
# Established so far:
#  - Windowing works under GPTK 7.7 (a real window rendered and took focus).
#  - With .NET 6.0.36 present, the launcher stack-overflows after loading it.
#  - With no .NET, the launcher cleanly reports "install .NET Desktop Runtime,
#    app host version 6.0.29" - so it targets 6.0.29 specifically.
#  - The .NET install is flaky: identical commands succeeded in one run and
#    silently failed in another, so it must be verified, not assumed.
#
# Axes: wine = {GPTK 7.7 cask, Wine 11.18 tarball}
#       dotnet = {6.0.29 pinned, latest 6.0.x}

name: dotnet-matrix
on: workflow_dispatch

jobs:
  launcher:
    runs-on: macos-15
    timeout-minutes: 40
    # Wine 11.18 blocked on prefix init: with no WINEPREFIX it built ~/.wine,
    # and the Mono/Gecko installer dialogs wait for a click that never comes.
    env:
      WINEPREFIX: /Users/runner/pfx
      WINEDLLOVERRIDES: "mscoree,mshtml="
      WINEDEBUG: "-all"
    strategy:
      fail-fast: false
      matrix:
        wine: [gptk, wine1118]
        dotnet: ["6.0.29", "latest"]

    steps:
      - name: Facts
        run: |
          uname -m; sw_vers -productVersion
          # macOS ships no GNU `timeout`; earlier runs wrapped every wine call
          # in it, so they silently no-op'd and .NET never installed.
          echo "timeout:  $(command -v timeout  || echo ABSENT)"
          echo "gtimeout: $(command -v gtimeout || echo ABSENT)"
          /usr/bin/pgrep -q oahd && echo "Rosetta present" \
            || softwareupdate --install-rosetta --agree-to-license

      - name: Install GPTK cask
        if: matrix.wine == 'gptk'
        run: |
          brew install --cask gcenx/wine/game-porting-toolkit
          xattr -dr com.apple.quarantine "/Applications/Game Porting Toolkit.app" 2>/dev/null || true
          echo "WINE=$(command -v wine64)" >> "$GITHUB_ENV"

      - name: Install Wine 11.18
        if: matrix.wine == 'wine1118'
        run: |
          mkdir -p "$HOME/wine"
          curl -fL -o "$HOME/w.tar.xz" \
            "https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.18/wine-devel-11.18-osx64.tar.xz"
          tar -xJf "$HOME/w.tar.xz" -C "$HOME/wine" --strip-components=1
          xattr -dr com.apple.quarantine "$HOME/wine" 2>/dev/null || true
          W=$(find "$HOME/wine" -maxdepth 3 -name 'wine' -type f -perm -u+x | head -1)
          [ -n "$W" ] || W=$(find "$HOME/wine" -maxdepth 3 -name 'wine64' -type f -perm -u+x | head -1)
          echo "WINE=$W" >> "$GITHUB_ENV"

      # Wine 11.18 tarball builds have been observed to BLOCK on --version.
      # Guarded by timeout-minutes and allowed to fail so the job continues.
      - name: Wine version
        timeout-minutes: 3
        continue-on-error: true
        run: |
          test -n "$WINE" || { echo "FAIL: no wine binary"; exit 1; }
          "$WINE" --version 2>&1 | tee /tmp/wine.txt

      - name: Prefix
        timeout-minutes: 8
        run: |
          export WINEPREFIX="$HOME/pfx" WINEDEBUG=-all
          "$WINE" wineboot --init || echo "WARN: wineboot nonzero"
          sleep 30
          "$WINE" cmd /c ver || echo "WARN: ver failed"
          mkdir -p "$HOME/pfx/drive_c/stage"

      # Verified, not assumed - this step failed silently once already.
      - name: Install .NET ${{ matrix.dotnet }}
        timeout-minutes: 15
        run: |
          export WINEPREFIX="$HOME/pfx" WINEDEBUG=-all
          cd "$HOME/pfx/drive_c/stage"
          if [ "${{ matrix.dotnet }}" = "latest" ]; then
            URL="https://aka.ms/dotnet/6.0/windowsdesktop-runtime-win-x64.exe"
          else
            URL="https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/${{ matrix.dotnet }}/windowsdesktop-runtime-${{ matrix.dotnet }}-win-x64.exe"
          fi
          echo "url: $URL"
          curl -fL -o dotnet.exe "$URL" || { echo "RESULT: .NET download FAILED"; exit 1; }
          ls -la dotnet.exe
          "$WINE" 'C:\stage\dotnet.exe' /quiet /norestart \
            || echo "WARN: installer returned nonzero"
          sleep 10
          # Verify, and report the exact version that landed.
          D="$HOME/pfx/drive_c/Program Files/dotnet/shared/Microsoft.WindowsDesktop.App"
          if [ -d "$D" ]; then
            echo "RESULT: .NET INSTALLED - $(ls "$D" | tr '\n' ' ')"
          else
            echo "RESULT: .NET MISSING"
          fi

      - name: Start launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export WINEPREFIX="$HOME/pfx"
          # Authenticated: four parallel jobs hit the unauthenticated API
          # limit and got 403.
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/eldewrito2/ElDewritoLauncher/releases/latest \
            | grep -o 'https://[^"]*launcher\.exe' | head -1)
          if [ -z "$URL" ]; then
            echo "WARN: API lookup failed, falling back to pinned 0.1.1"
            URL="https://github.com/eldewrito2/ElDewritoLauncher/releases/download/0.1.1/launcher.exe"
          fi
          echo "launcher url: $URL"
          curl -fL -o "$HOME/pfx/drive_c/stage/launcher.exe" "$URL"
          WINEDEBUG=+err,+warn "$WINE" 'C:\stage\launcher.exe' > "$HOME/l.log" 2>&1 &
          echo "started"

      - name: Watch 4 minutes
        run: |
          WINDOW=no
          for m in 1 2 3 4; do
            sleep 60
            pgrep -f 'launcher.exe' >/dev/null 2>&1 \
              && echo "min $m: process alive" || echo "min $m: process gone"
            APPS=$(osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>/dev/null || echo "?")
            echo "min $m: apps = $APPS"
            echo "$APPS" | grep -qiE 'launcher|wine' && WINDOW=yes
            /usr/sbin/screencapture -x "$HOME/m${m}.png" 2>/dev/null || true
          done
          echo "RESULT: window=$WINDOW"
          echo "RESULT: stack_overflows=$(grep -c 'stack overflow' "$HOME/l.log" 2>/dev/null || echo 0)"
          echo "RESULT: log_bytes=$(wc -c < "$HOME/l.log" 2>/dev/null || echo 0)"
          echo "--- tail ---"; tail -25 "$HOME/l.log" 2>/dev/null || echo "no log"

      - name: Evidence
        if: always()
        run: |
          mkdir -p /tmp/ev
          cp "$HOME"/m*.png /tmp/ev/ 2>/dev/null || true
          cp "$HOME/l.log" /tmp/ev/ 2>/dev/null || true
          cp /tmp/wine.txt /tmp/ev/wine.txt 2>/dev/null || echo "wine --version did not return" > /tmp/ev/wine.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dm-${{ matrix.wine }}-${{ matrix.dotnet }}
          path: /tmp/ev
          if-no-files-found: warn
