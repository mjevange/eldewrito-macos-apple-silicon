# Validates the GPTK install chain on an Apple Silicon macOS runner.
# Headless: proves the commands resolve, not that anything renders.
# NOTE: GitHub's arm64 runners report "Apple M1 (Virtual)" - they are VMs with a
# paravirtualized GPU, so they cannot verify D3DMetal rendering.

name: gptk-probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Machine facts
        run: |
          uname -m
          sw_vers -productVersion
          sysctl -n machdep.cpu.brand_string

      - name: Rosetta 2
        run: |
          if /usr/bin/pgrep -q oahd; then
            echo "Rosetta already present"
          else
            softwareupdate --install-rosetta --agree-to-license
          fi

      # Every GPTK guide says to install an x86_64 Homebrew in /usr/local.
      # Recording whether that is still possible at all.
      - name: Can an x86_64 Homebrew still be installed?
        continue-on-error: true
        run: |
          echo "::group::attempt"
          arch -x86_64 /bin/bash -c '
            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" \
              2>&1 | tail -5
          ' || echo "RESULT: x86_64 Homebrew install failed"
          echo "::endgroup::"
          test -x /usr/local/bin/brew \
            && echo "RESULT: /usr/local/bin/brew EXISTS" \
            || echo "RESULT: /usr/local/bin/brew ABSENT - x86_64 Homebrew unavailable"

      # install.sh refuses on x86_64, but extracting the tarball bypasses that
      # check. This decides whether Apple's documented GPTK route (and the
      # official ElDewrito guide's step 1) is genuinely dead or merely slower.
      - name: Can x86_64 Homebrew be installed via tarball?
        continue-on-error: true
        run: |
          sudo mkdir -p /usr/local/homebrew
          sudo chown -R "$(whoami)" /usr/local/homebrew
          curl -fsSL https://github.com/Homebrew/brew/tarball/master \
            | tar xz --strip 1 -C /usr/local/homebrew
          echo "--- extracted? ---"
          if [ -x /usr/local/homebrew/bin/brew ]; then
            echo "RESULT: tarball extraction OK"
          else
            echo "RESULT: tarball extraction FAILED"; exit 0
          fi
          echo "--- does it run under Rosetta? ---"
          if arch -x86_64 /usr/local/homebrew/bin/brew --version 2>&1 | head -3; then
            echo "RESULT: x86_64 brew RUNS - official GPTK route still viable"
          else
            echo "RESULT: x86_64 brew refuses to run - official route dead"
          fi
          echo "--- can it resolve the GPTK formula? ---"
          arch -x86_64 /usr/local/homebrew/bin/brew info apple/apple/game-porting-toolkit 2>&1 \
            | head -8 || echo "RESULT: could not resolve Apple formula"

      - name: Homebrew in use
        run: |
          which brew
          brew --prefix
          brew --version | head -1

      - name: Conflicting wine casks
        run: |
          brew list --cask 2>/dev/null | grep -E 'wine|crossover|kegworks' \
            || echo "none installed"

      # Hypothesis: the prebuilt cask needs no x86_64 Homebrew, because it only
      # downloads an app bundle. --no-quarantine has been removed from Homebrew.
      - name: Install GPTK cask via arm64 Homebrew
        run: |
          brew install --cask gcenx/wine/game-porting-toolkit
          echo "--- quarantine attr ---"
          xattr -l "/Applications/Game Porting Toolkit.app" 2>/dev/null || echo "(none)"
          xattr -dr com.apple.quarantine "/Applications/Game Porting Toolkit.app" 2>/dev/null \
            && echo "quarantine cleared" || echo "nothing to clear"

      - name: Locate wine64
        run: |
          which wine64 || echo "WARN: wine64 not on PATH"
          ls -la "$(brew --prefix)/bin" | grep -i wine || echo "WARN: no wine symlinks in brew prefix"
          file "$(readlink -f "$(which wine64)")" 2>/dev/null || true
          wine64 --version || echo "WARN: wine64 --version failed"

      - name: Create prefix
        run: |
          export WINEPREFIX="$HOME/my-game-prefix"
          export WINEDEBUG=-all
          wine64 wineboot --init || echo "WARN: wineboot nonzero"
          sleep 30
          wine64 cmd /c ver || echo "WARN: cmd ver failed"
          ls "$WINEPREFIX/drive_c" || echo "WARN: no drive_c"
          mkdir -p "$WINEPREFIX/drive_c/Program_Files"

      - name: Shims
        run: |
          D="$(brew --prefix)/bin"
          printf '#!/bin/sh\nexport WINEPREFIX="$1"; shift\nexport WINEDEBUG=-all\nexec wine64 "$@"\n' \
            > "$D/gameportingtoolkit"
          chmod +x "$D/gameportingtoolkit"
          gameportingtoolkit "$HOME/my-game-prefix" cmd /c ver \
            || echo "WARN: shim failed"

      - name: .NET 6 desktop runtime
        run: |
          cd "$HOME/my-game-prefix/drive_c/Program_Files"
          curl -fL -o dotnet.exe \
            "https://aka.ms/dotnet/6.0/windowsdesktop-runtime-win-x64.exe" \
            || { echo "FAIL: aka.ms .NET URL did not resolve"; exit 1; }
          ls -la dotnet.exe
          file dotnet.exe
          export WINEPREFIX="$HOME/my-game-prefix" WINEDEBUG=-all
          wine64 'C:\Program_Files\dotnet.exe' /quiet /norestart \
            || echo "WARN: installer returned nonzero"
          ls "$HOME/my-game-prefix/drive_c/Program Files/dotnet" 2>/dev/null \
            || echo "WARN: dotnet dir absent"

      - name: Fetch ElDewrito launcher
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/eldewrito2/ElDewritoLauncher/releases/latest \
            | grep -o 'https://[^"]*launcher\.exe' | head -1)
          echo "resolved: ${URL:-NONE}"
          test -n "$URL" || { echo "FAIL: could not resolve launcher.exe"; exit 1; }
          curl -fL -o "$HOME/my-game-prefix/drive_c/Program_Files/launcher.exe" "$URL"
          ls -la "$HOME/my-game-prefix/drive_c/Program_Files/launcher.exe"
          # Settles whether the launcher is 32- or 64-bit.
          file "$HOME/my-game-prefix/drive_c/Program_Files/launcher.exe"

      - name: Launch wizard and capture
        run: |
          export WINEPREFIX="$HOME/my-game-prefix"
          export WINEDEBUG=+err,+warn
          wine64 'C:\Program_Files\launcher.exe' > "$HOME/launcher.log" 2>&1 &
          echo "pid $!"
          for t in 20 40 60; do
            sleep 20
            /usr/sbin/screencapture -x "$HOME/shot-${t}s.png" 2>/dev/null \
              && echo "captured at ${t}s" || echo "screencapture unavailable at ${t}s"
          done
          pgrep -fl launcher.exe || echo "NOTE: launcher process not running"
          echo "--- launcher.log tail ---"
          tail -80 "$HOME/launcher.log" 2>/dev/null || echo "no log"

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p /tmp/evidence
          cp "$HOME"/shot-*.png /tmp/evidence/ 2>/dev/null || true
          cp "$HOME/launcher.log" /tmp/evidence/ 2>/dev/null || true
          {
            echo "== Program_Files =="
            ls -la "$HOME/my-game-prefix/drive_c/Program_Files" 2>&1
            echo; echo "== Program Files =="
            ls -la "$HOME/my-game-prefix/drive_c/Program Files" 2>&1
            echo; echo "== brew prefix bin (wine) =="
            ls -la "$(brew --prefix)/bin" 2>&1 | grep -i -E 'wine|gameporting' || echo none
          } > /tmp/evidence/prefix-listing.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gptk-probe-evidence
          path: /tmp/evidence
          if-no-files-found: warn
